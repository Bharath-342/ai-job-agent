version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: jobagent-postgres
    restart: always
    environment:
      POSTGRES_DB: jobagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: jobagent-backend
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/jobagent
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgrespassword
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      MOCK_MODE: "true"
      AUTO_APPLY_ENABLED: "false"
      REAL_EMAIL_ENABLED: "false"
      REAL_APPLICATIONS_ENABLED: "false"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: jobagent-frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:80"

volumes:
  pgdata:
