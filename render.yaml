services:
  - type: web
    name: ai-job-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: MOCK_MODE
        value: "true"
      - key: AUTO_APPLY_ENABLED
        value: "false"
      - key: REAL_EMAIL_ENABLED
        value: "false"
      - key: DAILY_APPLICATION_LIMIT
        value: "10"
      - key: DEFAULT_MIN_MATCH_SCORE
        value: "85"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-job-agent-db
          property: connectionString

databases:
  - name: ai-job-agent-db
    plan: free
    databaseName: jobagent
    user: jobagent_user
    region: oregon
