spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS ai_job_agent
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ai_job_agent
  flyway:
    enabled: true
    schemas: ai_job_agent
    default-schema: ai_job_agent
    locations: classpath:db/migration

app:
  mock-mode: true
  auto-apply-enabled: false
  real-email-enabled: false
  daily-application-limit: 10
  default-min-match-score: 85
