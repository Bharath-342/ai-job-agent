server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: ai-job-agent
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:jobagent;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Application specific configurations
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mock-mode: ${MOCK_MODE:true}
  auto-apply-enabled: ${AUTO_APPLY_ENABLED:false}
  real-email-enabled: ${REAL_EMAIL_ENABLED:false}
  real-applications-enabled: ${REAL_APPLICATIONS_ENABLED:false}
  browser-automation-enabled: ${BROWSER_AUTOMATION_ENABLED:false}
  daily-application-limit: ${DAILY_APPLICATION_LIMIT:10}
  default-min-match-score: ${DEFAULT_MIN_MATCH_SCORE:85}
  target-graduation-year: ${TARGET_GRADUATION_YEAR:2026}
  max-experience-years: ${MAX_EXPERIENCE_YEARS:1.0}
  target-country: ${DEFAULT_COUNTRY:India}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
